<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Surbiton Sorts">
<meta name="theme-color" content="#2c521c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%235c9b3b'/%3E%3Ctext x='90' y='120' font-size='100' text-anchor='middle'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Surbiton Sorts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: landscape. Left: the house (kitchen window, Mum at the back door, blue ping pong table for spares). Middle: the long lawn running left to right with a winding gravel path and planters dotted along it. Far right: The Shed (top), the patio (middle), Oliver's Arms (bottom). */
:root{
  --grass-a:#5c9b3b; --grass-b:#67a643; --grass-deep:#3f7428; --long-grass:#2f6420;
  --soil:#4a3121; --soil-fleck:#5d3f2a; --timber:#8a5a33; --timber-dark:#5e3b1f;
  --brick:#9e4536; --mortar:#d9c9b0; --slate:#9aa3a7; --slate-line:#7f888c;
  --shed:#7f9b74; --shed-dark:#6f8a65; --pub:#5e2430; --pub-dark:#4f1d28; --brass:#d8ab3d;
  --gravel:#d6ccb2; --gravel-dark:#b3a78a; --fence:#7b5636;
  --cream:#fbf6e9; --ink:#2b2418; --hud:#2c521c; --glow:#fff1a0; --danger:#e0533c;
  --title:'Luckiest Guy','Chewy','Arial Black',system-ui,sans-serif;
  --display:'Chewy','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --slot:40px; --slot-s:22px; --slot-p:30px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--hud);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--grass-a)}
#game{height:100%;display:flex;flex-direction:column;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

.hud{background:var(--hud);color:var(--cream);border-radius:8px;padding:5px 7px;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hud .hr{display:flex;align-items:center;gap:5px}
.lvl{font-family:var(--display);font-size:17px;letter-spacing:.5px;white-space:nowrap;flex:1}
.timer{flex:1;height:8px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden;min-width:20px}
.timer i{display:block;height:100%;background:#f2d24b;border-radius:5px;transition:width .95s linear,background .3s}
.timer.low i{background:var(--danger)}
.time{font-weight:900;font-variant-numeric:tabular-nums;font-size:14px}
.hbtn{flex:none;background:rgba(255,255,255,.14);border:0;border-radius:7px;width:28px;height:26px;padding:0;display:grid;place-items:center}
.hbtn:active{background:rgba(255,255,255,.28)}
.hbtn svg{display:block}
html,body{background:var(--grass-a);overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;margin:0}
.main{flex:1;min-height:0;display:flex;height:100%}

/* House (left) */
.house{flex:none;width:clamp(150px,19vw,220px);position:relative;z-index:4;display:flex;flex-direction:column;gap:6px;
  padding-top:max(8px,calc(var(--band,0px) + 4px));padding-bottom:max(8px,min(env(safe-area-inset-bottom,0px),14px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:10px;
  border-right:7px solid #5f6264;background-color:var(--brick);
  background-image:linear-gradient(var(--mortar) 2px,transparent 2px),linear-gradient(90deg,var(--mortar) 2px,transparent 2px);background-size:34px 15px}
.kwin{background:#a9d0dc;border:4px solid var(--cream);border-radius:3px;padding:4px 6px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 2px #7fb0c0}
.kwin .lbl{color:#24414a;display:block}
.kwin .left{display:block}
.nq{display:flex;gap:4px;font-size:20px;line-height:1}
.nq span{width:28px;height:28px;display:grid;place-items:center;background:rgba(255,255,255,.45);border-radius:6px}
.nq span + span{opacity:.6}
.left{font-size:10px;font-weight:900;color:#24414a}
.lbl{font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.wall{position:relative;flex:1;min-height:80px}
.door{position:absolute;left:0;bottom:0;width:30%;max-width:60px;height:min(100%,104px);background:#2f5a3e;border:4px solid var(--cream);border-bottom:0;border-radius:3px 3px 0 0;box-shadow:inset 0 0 0 4px #284d35}
.door::before{content:"";position:absolute;left:18%;right:18%;top:9%;height:26%;background:#a9d0dc;border:3px solid var(--cream)}
.mum{position:absolute;left:6%;bottom:0;height:min(100%,150px);aspect-ratio:96/118}
.mum svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hand{position:absolute;left:62%;top:6%;width:56px;height:56px;display:grid;place-items:center;font-size:38px;line-height:1;border-radius:50%;background:radial-gradient(circle,rgba(255,241,160,.85),rgba(255,241,160,0) 70%);animation:bob 1.8s ease-in-out infinite;z-index:3}
.hand.empty{animation:none;background:none}
.bubble{position:absolute;left:calc(100% + 18px);top:4px;background:var(--cream);color:var(--ink);font-weight:800;font-size:12px;line-height:1.2;padding:6px 9px;border-radius:12px;width:max-content;max-width:160px;box-shadow:0 2px 0 rgba(0,0,0,.25);opacity:0;transform:translateX(-4px);transition:.25s;pointer-events:none;z-index:6}
.bubble::before{content:"";position:absolute;left:-6px;top:12px;border:6px solid transparent;border-right-color:var(--cream);border-left:0}
.bubble.on{opacity:1;transform:none}
.pw{display:flex;gap:5px}
.pwb{flex:1;position:relative;height:34px;border:0;border-radius:9px;background:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:3px;padding:0;font-size:19px;line-height:1}
.pwb b{font-size:11px;font-weight:900;color:var(--ink)}
.pwb:disabled,.pwb.off{opacity:.45;filter:grayscale(.7)}
.pwb.on{background:#ffe9a8;box-shadow:0 0 0 3px var(--glow),0 3px 0 rgba(0,0,0,.25)}
div.pwb[data-drag]{animation:bob 2s ease-in-out infinite}
.score{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:6px;background:rgba(43,36,24,.78);color:var(--cream);border-radius:14px;padding:3px 12px 5px;pointer-events:none;overflow:hidden}
.score span{font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.score b{font-family:var(--display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.score em{font-style:normal;font-family:var(--title);color:#ffb347;font-size:15px}
.score i{position:absolute;left:0;bottom:0;height:3px;width:0;background:#ffb347}
.score i.run{animation:drain 6s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.floaty{position:absolute;z-index:30;pointer-events:none;transform:translate(-50%,0);font-family:var(--display);font-size:22px;color:#fff3b0;-webkit-text-stroke:1px #2b2418;paint-order:stroke fill;text-shadow:0 2px 0 #2b2418;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{to{transform:translate(-50%,-50px);opacity:0}}
.banner{position:absolute;z-index:31;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--title);font-size:clamp(34px,7vw,64px);color:#ffb347;-webkit-text-stroke:2px #2b2418;paint-order:stroke fill;text-shadow:0 5px 0 #2b2418;white-space:nowrap;animation:bannerpop 1.2s ease-out forwards}
@keyframes bannerpop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}35%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.loose{position:absolute;z-index:6;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;display:grid;place-items:center;font-size:32px;line-height:1;
  background:conic-gradient(var(--danger) calc(var(--p)*360deg),rgba(255,255,255,.25) 0);box-shadow:0 0 0 3px #fff,0 4px 8px rgba(0,0,0,.35);animation:wiggle .5s ease-in-out infinite alternate}
.loose .pc{background:rgba(255,255,255,.85);border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.loose em{position:absolute;right:-6px;top:-6px;font-style:normal;font-weight:900;font-size:11px;background:var(--danger);color:#fff;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center}
@keyframes wiggle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.squirrel{position:absolute;z-index:29;font-size:40px;line-height:1;pointer-events:none;transform:translate(-50%,-50%) scaleX(var(--flip));filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.wild{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fly{position:absolute;left:0;font-size:20px;animation:flyx linear infinite}
.fly i{display:block;font-style:normal;animation:flyy 1.6s ease-in-out infinite alternate}
.f1{top:22%;animation-duration:19s}.f2{top:58%;animation-duration:13s;animation-delay:-6s;font-size:16px}.f3{top:80%;animation-duration:24s;animation-delay:-14s;animation-direction:reverse}
@keyframes flyx{from{transform:translateX(-40px)}to{transform:translateX(calc(100vw))}}
@keyframes flyy{from{transform:translateY(-14px) rotate(-8deg)}to{transform:translateY(14px) rotate(8deg)}}
.fresh{background:#fff3cf;border-radius:12px;padding:8px}
.fresh>div{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:4px}
.fresh>div span{display:flex;flex-direction:column;align-items:center;font-size:28px;line-height:1}
.fresh small{font-size:10px;font-weight:800;margin-top:3px}
.tally{display:flex;flex-direction:column;align-items:center;line-height:1}
.tally span{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.tally b{font-family:var(--title);font-weight:400;font-size:40px;color:#e86a8a;-webkit-text-stroke:1.5px #2b2418;paint-order:stroke fill}
.tally em{font-style:normal;font-weight:900;color:#d0761b;font-size:13px;margin-top:3px}
.tally small{font-size:12px;opacity:.7;margin-top:3px}
.earn{font-weight:900;font-size:16px;background:#fff3cf;border-radius:10px;padding:6px}
.earn small{font-weight:700;opacity:.7}
.shop li{align-items:center!important;background:#eef3e2;border-radius:10px;padding:8px}
.shop li span{flex:1}
.buy{border:0;border-radius:9px;background:#4f8a2f;color:var(--cream);font-weight:900;padding:7px 9px;box-shadow:0 3px 0 #315a1b;white-space:nowrap}
.buy:disabled{opacity:.4}
.pingpong{display:flex;flex-direction:column;gap:3px;--slot:var(--slot-p)}
.pp-lbl{display:flex;justify-content:space-between;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pp-top{position:relative;display:grid;grid-template-columns:repeat(3,1fr);row-gap:9px;column-gap:4px;justify-items:center;padding:5px 6px;
  background:#1f5fa8;border:3px solid #f4f4f4;border-radius:4px;box-shadow:0 5px 0 #173f6d,0 8px 8px rgba(0,0,0,.25)}
.pp-top::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.75)}
.pp-top::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:5px;margin-top:-2.5px;background:repeating-linear-gradient(90deg,#222 0 2px,#ddd 2px 4px);border-top:2px solid #fff;box-shadow:0 2px 2px rgba(0,0,0,.35)}
.pp-top.warn{background:#2a6fbe;box-shadow:0 5px 0 #173f6d,0 0 0 3px var(--danger)}
.pp-top .slot{position:relative;z-index:1;border-radius:8px;background:rgba(255,255,255,.14)}
.pp-top .slot.bat{background:none;font-size:calc(var(--slot)*.7);opacity:.95}
.porch{background:#c3bcab;border-radius:6px;padding:4px 6px 6px;box-shadow:0 4px 0 #8f8878;display:flex;flex-direction:column;gap:3px;--slot:var(--slot-p)}
.porch .lbl{display:flex;justify-content:space-between;color:#4a4335}
.porch.warn{background:#e6b9a8;box-shadow:0 4px 0 #b07f6d}
.pslots{display:flex;justify-content:space-between;gap:3px}
.pslots .slot{border-radius:8px;background:rgba(60,50,30,.18)}

/* Lawn (middle) */
.lawn{flex:1;min-width:0;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,var(--grass-a) 0 46px,var(--grass-b) 46px 92px)}
.lawn::before,.lawn::after{content:"";position:absolute;left:0;right:0;height:8px;z-index:1;pointer-events:none;background:repeating-linear-gradient(90deg,var(--fence) 0 22px,#5f4128 22px 24px)}
.lawn::before{top:0;box-shadow:0 3px 0 rgba(0,0,0,.15)}.lawn::after{bottom:0;box-shadow:0 -3px 0 rgba(0,0,0,.15)}
.field{position:absolute;left:0;right:0;top:0;bottom:min(env(safe-area-inset-bottom,0px),14px)}
.lawn svg.ground{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Far end (right) */
.end{flex:none;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;align-items:stretch;gap:4px;
  padding-top:max(16px,calc(var(--band,0px) + 12px));padding-bottom:max(6px,min(env(safe-area-inset-bottom,0px),14px));padding-left:8px;padding-right:max(12px,env(safe-area-inset-right,0px));
  border-left:5px solid #6e7679;background-color:var(--slate);
  background-image:linear-gradient(var(--slate-line) 2px,transparent 2px),linear-gradient(90deg,var(--slate-line) 2px,transparent 2px);background-size:34px 34px}
.patio-set{display:flex;flex-direction:column;align-items:center;gap:1px}
.patio-set .pset{display:flex;align-items:flex-end;justify-content:center;gap:0}
.patio-set svg{display:block;height:auto}
.patio-set .dad{width:34px}
.patio-set .pset{position:relative}
#app.dad-away .patio-set .dad{visibility:hidden}
#app.dad-tea .patio-set .pset::before{content:"☕";position:absolute;left:19px;top:27px;font-size:13px;line-height:1;z-index:2;animation:sip 3.2s ease-in-out infinite}
@keyframes sip{0%,55%,100%{transform:translate(0,0) rotate(0)}70%,85%{transform:translate(-7px,-15px) rotate(-28deg)}}
.walker{position:absolute;left:0;top:0;z-index:7;width:38px;height:61px;margin:-59px 0 0 -19px;pointer-events:none;transition:opacity .35s}
.walker::after{content:"";position:absolute;left:6px;right:6px;bottom:-3px;height:7px;border-radius:50%;background:rgba(0,0,0,.25);z-index:-1}
.walker .wb{width:100%;height:100%;transform:scaleX(var(--dir,1));position:relative}
.walker svg{width:100%;height:100%;display:block;transform-origin:50% 100%;animation:waddle .42s ease-in-out infinite alternate}
.walker .mug{position:absolute;right:-7px;top:31px;font-size:15px;line-height:1;display:none;animation:waddle .42s ease-in-out infinite alternate-reverse}
.walker.tea .mug{display:block}
@keyframes waddle{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-2px)}}.patio-set .tbl{width:34px}
#dadsay{position:absolute;z-index:16;background:var(--cream);color:var(--ink);font-weight:800;font-size:12px;line-height:1.2;padding:6px 9px;border-radius:12px;width:max-content;max-width:150px;box-shadow:0 2px 0 rgba(0,0,0,.25);opacity:0;transform:translate(-100%,-50%) translateX(4px);transition:opacity .25s,transform .25s;pointer-events:none}
#dadsay::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--cream);border-right:0}
#dadsay.on{opacity:1;transform:translate(-100%,-50%)}
.patio-set span{font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#3d4447}
.building{position:relative;border-radius:2px;padding:15px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.building::before{content:"";position:absolute;left:-4px;right:-4px;top:-11px;height:15px;background:#3b3833}
.shed{background:repeating-linear-gradient(90deg,var(--shed) 0 11px,var(--shed-dark) 11px 13px)}
.shed::before{clip-path:polygon(0 100%,0 55%,100% 0,100% 100%)}
.pub{background:repeating-linear-gradient(90deg,var(--pub) 0 11px,var(--pub-dark) 11px 13px)}
.pub::before{clip-path:polygon(0 100%,50% 0,100% 100%);background:#2d2a26}
.sign{position:absolute;top:1px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:10px;line-height:1;padding:2px 5px 1px;border-radius:3px;white-space:nowrap;z-index:2}
.shed .sign{background:var(--cream);color:#3e5236}
.pub .sign{background:var(--brass);color:#3a1610}
.locked > .cont{opacity:.35}
.lockmsg{position:absolute;inset:14px 0 0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:10px;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6);line-height:1.2}

/* Containers */
.cont{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .15s,outline-color .15s}
.slots{display:grid;gap:4px;justify-content:center}
.slot{width:var(--slot);height:var(--slot);display:grid;place-items:center;border:0;padding:0;border-radius:50%;background:rgba(0,0,0,.2);font-size:calc(var(--slot)*.68);line-height:1}
.pc{display:block;transition:transform .15s,opacity .15s;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
[data-drag]{cursor:grab;touch-action:none}
.lifting{opacity:.25;transform:scale(.85)}
.pop{animation:pop .28s ease-out}
.peek{display:flex;justify-content:space-around;width:100%;height:calc(var(--slot)*.42);font-size:calc(var(--slot)*.34);opacity:.5;filter:grayscale(.55) brightness(.75)}
.peek span{display:block;flex:1;max-width:var(--slot);text-align:center}
.depth{position:absolute;top:-8px;right:-8px;background:var(--cream);color:var(--ink);font-weight:900;font-size:11px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.4);z-index:2}
.depth::before{content:"+"}
.can{outline:3px dashed var(--glow);outline-offset:3px}
.hover{outline:4px solid var(--glow)!important;transform:scale(1.06)}
.cont.shake{animation:shake .32s}
.slot.clr .pc{animation:bloom .48s forwards}

.bed{position:absolute;transform:translate(-50%,-50%);border:6px solid var(--timber);border-radius:8px;padding:3px 5px 5px;
  background:radial-gradient(circle at 30% 40%,var(--soil-fleck) 0 2px,transparent 3px) 0 0/13px 13px,var(--soil);
  box-shadow:inset 0 4px 7px rgba(0,0,0,.45),0 5px 0 var(--timber-dark),0 9px 10px rgba(0,0,0,.18)}
.tarp{position:absolute;inset:-6px;z-index:3;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6);
  background:repeating-linear-gradient(45deg,#4b6b3a 0 10px,#43613a 10px 20px);box-shadow:inset 0 0 0 3px #2f4a27}
.tarp b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.tarp span{font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.order{display:flex;align-items:center;gap:3px;background:var(--cream);border-radius:9px;padding:1px 6px;font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#3d4447;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.order b{font-size:15px;line-height:1}
.order.pulse{animation:pop .4s}
.bed.hover{transform:translate(-50%,-50%) scale(1.06)}
.shelf,.bar{--slot:var(--slot-s);padding:1px 3px 2px;border-radius:2px}
.shelf{background:#b98b56;border-bottom:4px solid #7c5530}
.shelf .slot{border-radius:5px;background:rgba(60,35,10,.22)}
.bar{background:#3a2317;border-top:3px solid var(--brass);border-bottom:3px solid #24150d}
.bar .slot{border-radius:5px;background:rgba(255,255,255,.08)}
.shelf .peek,.bar .peek{height:calc(var(--slot)*.3);font-size:calc(var(--slot)*.28)}
.shelf .slots,.bar .slots{gap:2px;display:flex}

};

let S=null, D=null;

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function capsFor(level,n){
  const pat=level<=2?[3]:level<=4?[4,3,3]:level<=6?[3,4,5]:[3,4,5,6];

function availFor(cat,n){

  if(cat==='tool')return Math.min(all,3+Math.floor(Math.max(0,n-4)/2));

function genZone(zone,[n,t,L,extra],idBase,caps){
  const cat=CAT_OF[zone],av=Math.max(t,availFor(cat,GEN_LEVEL));
  const types=shuffle(BY_CAT[cat].slice(0,av)).slice(0,t);
  const capSum=caps.reduce((a,b)=>a+b,0);
  const P=caps.reduce((a,c)=>a+c-1,0)+(L-1)*capSum;

  const sizes=shuffle(caps.slice()),pool=[];let i=0;
  const want=P+extra*3;
  const tsize={};types.forEach((ty,j)=>tsize[ty]=sizes[j%sizes.length]);
  while(pool.length<want||i<t){const ty=types[i%t],sz=tsize[ty];for(let q=0;q<sz;q++)pool.push(ty);i++}
  const triple=ly=>ly.every(x=>x&&x===ly[0]);

    shuffle(pool);let idx=0,ok=true;conts=[];

      conts.push({id:idBase+c,zone,layers,clearing:false,cap,v});
    }
    if(ok)break;
  }

function startLevel(n,menu,retry){
  GEN_LEVEL=n;

const cont=id=>S.conts.find(c=>c.id===id);

/* ---------- Dad's tea run: patio -> along the path -> house -> back with a cuppa ---------- */
let walk=null;
function pathInfo(){
  const f=$('.field'),p=f&&f.querySelector('svg.ground > path');if(!p)return null;
  const d=p.getAttribute('d'),L=p.getTotalLength(),W=f.clientWidth;
  if(!pathInfo.c||pathInfo.c.d!==d||pathInfo.c.W!==W){
    let a=0,b=L;
    for(let i=0;i<=200;i++){if(p.getPointAtLength(L*i/200).x>=14){a=L*i/200;break}}
    for(let i=200;i>=0;i--){if(p.getPointAtLength(L*i/200).x<=W-14){b=L*i/200;break}}
    pathInfo.c={d,W,a,b};
  }
  return {p,f,a:pathInfo.c.a,b:pathInfo.c.b};
}
function pathPt(u){const P=pathInfo();if(!P)return null;const q=P.p.getPointAtLength(P.a+(P.b-P.a)*u),fr=lr(P.f);return [fr.left+q.x,fr.top+q.y]}
function patioPt(){const d=$('.patio-set .dad');if(!d)return null;const r=lr(d);return [r.left+r.width/2,r.bottom-1]}
function doorPt(){const d=$('.door');if(!d)return null;const r=lr(d);return [r.left+r.width*.62,r.bottom-1]}
function startDadWalk(){
  if(walk||!S||S.state!=='play'||!pathInfo()||!patioPt())return;
  walk={busy:true};
  dadSay(pick(['Fancy a cuppa. Back in a mo!','Kettle time!','I\u2019ll just pop in and make a brew','Anyone for tea?']));
  setTimeout(runDadWalk,1300);
}
function runDadWalk(){
  const app=$('#app'),el=document.createElement('div');
  el.className='walker';el.innerHTML=`<div class="wb">${DAD_SVG}<span class="mug">☕</span></div>`;
  app.appendChild(el);app.classList.add('dad-away');app.classList.remove('dad-tea');
  const SPEED=80,steps=[
    {k:'line',a:patioPt,b:()=>pathPt(1),dur:1300,dir:-1},
    {k:'path',u0:1,u1:0,dir:-1},
    {k:'line',a:()=>pathPt(0),b:doorPt,dur:1100,dir:-1,fade:'out'},
    {k:'wait',dur:3600,start:()=>{el.style.opacity=0;say(pick(['Kettle\u2019s on, love','Two sugars, is it?','Mind the biscuits!']))}},
    {k:'line',a:doorPt,b:()=>pathPt(0),dur:1100,dir:1,fade:'in',tea:true},
    {k:'path',u0:0,u1:1,dir:1,tea:true},
    {k:'line',a:()=>pathPt(1),b:patioPt,dur:1300,dir:1,tea:true}
  ];
  let i=0,t0=performance.now(),dur=0;
  const begin=()=>{const st=steps[i];t0=performance.now();
    if(st.k==='path'){const P=pathInfo();dur=P?Math.max(2500,(P.b-P.a)/SPEED*1000):2500}else dur=st.dur;
    if(st.start)st.start();
    el.classList.toggle('tea',!!st.tea);if(st.dir)el.style.setProperty('--dir',st.dir);
    if(st.fade==='in')el.style.opacity=1;};
  const finish=()=>{el.remove();app.classList.remove('dad-away');walk=null;
    if(!S)return;S.dadT=Math.max(S.dadT,50+Math.round(Math.random()*30));app.classList.add('dad-tea');
    setTimeout(()=>dadSay(pick(['Ahh, lovely cuppa','That\u2019s the stuff','Proper builder\u2019s tea, that'])),400);
    clearTimeout(finish.t);finish.t=setTimeout(()=>app.classList.remove('dad-tea'),11000)};
  begin();
  const frame=now=>{
    const st=steps[i];let u=Math.min(1,(now-t0)/dur),pt=null;
    if(st.k==='line'){const a=st.a(),b=st.b();if(a&&b){const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;pt=[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e]}
      if(st.fade==='out')el.style.opacity=String(1-Math.max(0,(u-.55)/.45))}
    else if(st.k==='path')pt=pathPt(st.u0+(st.u1-st.u0)*u);
    if(st.k!=='wait'){if(!pt){finish();return}el.style.transform=`translate(${pt[0]}px,${pt[1]}px)`}
    if(u>=1){i++;if(i>=steps.length){finish();return}begin()}
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function squirrelRaid(){

  if(!opts.length)return;
  const [c,i]=pick(opts),el=document.querySelector(`[data-cont="${c.id}"]`),fe=$('.field');if(!el||!fe)return;
  const ar=ZR,fr=lr(fe),r=lr(el);
  const bx=r.left-ar.left+r.width/2,by=r.top-ar.top+r.height/2,fromLeft=Math.random()<.5;
  const sx=fromLeft?fr.left-ar.left-30:fr.right-ar.left+30,ex=fromLeft?fr.right-ar.left+40:fr.left-ar.left-40;

function fitViewport(){
  const app=$('#app'),vv=window.visualViewport;

    <h2>${why==='time'?'Out of time':'The ping pong table is full'}</h2>
    <p>${why==='time'?'The sun’s gone down on this one.':'Nothing on the table or in Mum’s hands has anywhere to go.'}</p>
    <button class="cta" data-act="retry">Try again</button>
    <button class="ghostbtn" data-act="menu">Choose a level</button>`);
}
function showMenu(){
  if(S.state==='play')S.state='paused';
  const max=Math.max(unlocked+4,20);
  const btns=[];for(let i=1;i<=max;i++){const s=stars[i]||0;btns.push(`<button data-lvl="${i}" class="${i===S.n?'cur':''}" ${i>unlocked?'disabled':''}>${i}<small>${s?'★'.repeat(s):i>unlocked?'🔒':'·'}</small></button>`)}
  overlay(`<h2>Levels</h2><p>Shed from level 4, garden bar from level 7. Weeds from 11, covered planters from 13, Dad\u2019s ping pong bats from 18, The levels never run out.</p>
    <div class="lgrid">${btns.join('')}</div>
    <button class="cta" data-act="resume">${S.state==='paused'?'Back to the garden':'Close'}</button>
    ${S.state==='paused'?`<button class="ghostbtn" data-act="retry">Restart level ${S.n}</button>`:''}
    <button class="ghostbtn" data-act="home">Main menu</button>`);
}

async function toggleFull(){
  try{
    if(document.fullscreenElement)await document.exitFullscreen();
    else{await document.documentElement.requestFullscreen({navigationUI:'hide'});try{await screen.orientation.lock('landscape')}catch(e){}}
  }catch(e){toast('Full screen isn\u2019t available here')}
}
document.addEventListener('fullscreenchange',()=>{if(S)render()});
$('#app').addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-lvl]');if(!t)return;
  if(t.dataset.lvl){closeOv();return startLevel(+t.dataset.lvl)}
  const a=t.dataset.act;
  if(a==='go'){closeOv();S.state='play';S.handPop=true;render();if(S.F.orders&&S.cfg.shed)setTimeout(newOrder,1500);if(S.n<4)setTimeout(()=>dadSay(pick(DAD.idle)),900)}
  else if(a==='fs')toggleFull();
  else if(a==='next'){closeOv();startLevel(S.n+1)}
  else if(a==='retry'){closeOv();startLevel(S.n)}
  else if(a==='menu')showMenu();
  else if(a==='play'){closeOv();startLevel(unlocked)}
  else if(a==='home'){S.state='menu';showMain()}
  else if(a==='resume'){closeOv();if(S.state==='paused'){S.state='play';render()}else if(S.state==='menu')showMain();else if(S.state!=='play')showMenu()}
  else if(a==='tea')useTea();
  else if(a==='sound'){muted=!muted;store.set('muted',muted);render()}
});
setInterval(()=>{
  if(!S||S.state!=='play'||document.hidden)return;
  if(S.freeze>0){S.freeze--;const b=document.querySelector('[data-act="tea"] b');if(b)b.textContent=S.freeze?S.freeze+'s':S.inv.tea;if(!S.freeze&&!D)render()}
  else S.t--;
  updateTimer();updateScore();
  if(--S.dadT<=0){S.dadT=55+Math.round(Math.random()*35);startDadWalk()}
  if(S.F.squirrels&&(S.queue.length||S.hand)&&--S.sqT<=0){S.sqT=S.F.squirrelEvery+Math.round(Math.random()*8);squirrelRaid()}
  let gone=false;
  S.loose.forEach((l,i)=>{if(!l)return;if(D&&D.src.k==='lawn'&&D.src.p===i)return;l.t--;
    const el=document.querySelector(`[data-drag="lawn:${i}"]`);if(el){el.style.setProperty('--p',l.t/8);el.querySelector('em').textContent=l.t}
    if(l.t<=0){S.loose[i]=null;S.t=Math.max(1,S.t-5);gone=true;toast(`The squirrel got away with it! -5 seconds`);sfx('bad')}});
  if(gone){checkMatchAll();if(!D)render();checkEnd()}
  let un=false;S.conts.forEach(c=>{if(c.lock&&(c.lockT=(c.lockT||0)+1)>=30){c.lock=0;un=true}});
  if(un&&!D){toast('A planter has been uncovered');checkMatchAll();render()}
  if(S.F.weeds&&(S.queue.length||S.hand)&&--S.weedT<=0){S.weedT=S.F.weedEvery;if(!D)sproutWeed()}
  if(S.t<=0){S.t=0;updateTimer();lose('time')}
},1000);

fitViewport();startLevel(unlocked,true);
</script>

</body>
</html>
